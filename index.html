<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f8f3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>慢慢日常｜每日打卡</title>
<style>
:root{--ink:#34463e;--muted:#89978e;--green:#759c82;--green2:#eaf2e8;--cream:#fbfaf5;--peach:#f7e7dc;--lav:#efedf6;--line:#e9ece5;--white:#fff;--shadow:0 12px 35px #4357440c}*{box-sizing:border-box}body{margin:0;background:#f5f7f2;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Noto Sans TC",system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}.shell{max-width:1080px;margin:auto;min-height:100vh;padding:24px 32px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:16px;background:#e5efe3;display:grid;place-items:center;font-size:23px}.brand h1{font-size:19px;margin:0 0 2px;letter-spacing:.05em}.brand small{color:var(--muted);font-size:12px}.date-label{color:var(--muted);font-size:13px}.welcome{margin:12px 0 22px}.welcome h2{font-weight:600;font-size:25px;margin:0 0 5px}.welcome p{margin:0;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(320px,.88fr);gap:20px}.card{background:var(--white);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.card-head h3{font-size:16px;margin:0;font-weight:650}.sub{font-size:12px;color:var(--muted)}.month-nav{display:flex;gap:12px;align-items:center}.month-nav strong{font-size:15px;min-width:78px;text-align:center}.icon-btn{width:30px;height:30px;border:0;border-radius:10px;background:#f5f7f2;color:#718278}.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.week{color:#a2ada5;font-size:11px;margin:0 0 8px}.week div{padding:6px 0}.day{height:43px;display:grid;place-items:center;position:relative;font-size:13px;border:0;background:transparent;border-radius:14px;margin:2px}.day:hover{background:#f4f7f1}.day.dim{color:#c4cbc5}.day.today{outline:1px solid #b7cfb9}.day.selected{background:#789c83;color:white;font-weight:600}.day .dot{position:absolute;width:4px;height:4px;border-radius:50%;background:#d69c7a;bottom:4px}.day.selected .dot{background:white}.month-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:15px;margin-top:13px}.month-foot span{color:var(--muted);font-size:12px}.progress{background:#edf2eb;border-radius:99px;height:7px;width:125px;overflow:hidden}.progress i{display:block;background:#8dad91;height:100%;border-radius:inherit;transition:width .4s}.list-card{grid-row:span 2}.list-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.list-top h3{margin:0;font-size:17px}.count{font-size:12px;color:var(--muted);margin-top:4px}.add-btn{border:0;background:#789c83;color:#fff;border-radius:13px;padding:10px 14px;font-size:13px;box-shadow:0 4px 10px #789c832a}.add-btn:hover{background:#648a70}.items{display:flex;flex-direction:column;gap:9px}.item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #edf0ea;border-radius:16px;transition:.2s}.item.done{background:#f8faf7}.check{width:23px;height:23px;border-radius:8px;border:1.5px solid #cbd7cb;background:white;flex:none;display:grid;place-items:center;color:white;font-size:14px;transition:.2s}.done .check{background:#85a78a;border-color:#85a78a;animation:pop .35s ease}.item-main{min-width:0;flex:1}.item-name{font-size:14px}.done .item-name{text-decoration:line-through;color:#a1aaa2}.item-meta{font-size:11px;color:#a0aaa2;margin-top:4px}.record-btn{border:0;background:#f3f6f0;color:#74877a;border-radius:10px;padding:7px;font-size:12px}.record-btn:hover{background:#e8f0e6}.delete-btn{border:0;background:transparent;color:#c0c9c0;font-size:17px;padding:4px}.delete-btn:hover{color:#c37f72}.empty{text-align:center;padding:32px 10px;color:#9da99f;font-size:13px}.empty span{display:block;font-size:28px;margin-bottom:8px}.note-preview{font-size:11px;color:#819186;padding:7px 0 0 35px}.bottom{margin-top:19px;background:#f2f1f8;border-radius:18px;padding:14px 17px;display:flex;gap:12px;align-items:center;color:#737789;font-size:12px;line-height:1.5}.bottom b{font-size:18px}.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:#405448;color:white;padding:11px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:9}.toast.show{opacity:1;transform:translate(-50%,0)}.confetti{position:fixed;pointer-events:none;z-index:8;font-size:20px;animation:fly .8s ease-out forwards}@keyframes pop{50%{transform:scale(1.25)}}@keyframes fly{to{transform:translate(var(--x),-85px) rotate(180deg);opacity:0}}.modal-bg{position:fixed;inset:0;background:#283a3066;display:none;align-items:flex-end;justify-content:center;z-index:10;padding:20px}.modal-bg.open{display:flex}.modal{background:#fff;border-radius:25px;width:min(100%,480px);padding:22px;box-shadow:0 20px 60px #23352a30;max-height:90vh;overflow:auto}.modal-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-title h3{margin:0;font-size:18px}.close{border:0;background:#f1f4ef;border-radius:50%;width:32px;height:32px;font-size:18px}.field{margin:13px 0}.field label{display:block;font-size:12px;color:#738278;margin:0 0 7px}.field input,.field textarea{width:100%;border:1px solid #e5eae3;background:#fbfcfa;border-radius:13px;padding:12px;color:var(--ink);outline:none}.field input:focus,.field textarea:focus{border-color:#9db99e}.field textarea{resize:vertical;min-height:84px}.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}.type-option{border:1px solid #e6ebe4;border-radius:13px;padding:11px;text-align:center;font-size:13px;color:#748278;background:white}.type-option.active{border-color:#8eaf92;background:#f0f6ef;color:#55755d}.voice-row{display:flex;gap:8px}.voice-row input{flex:1}.voice{border:0;background:#f2eee9;color:#98775f;border-radius:12px;padding:0 12px;font-size:12px;white-space:nowrap}.voice.listening{background:#f8e6e1;color:#bb7568}.save{width:100%;border:0;background:#789c83;color:white;border-radius:14px;padding:13px;margin-top:9px;font-weight:600}.rec-note{font-size:11px;color:#9ba69e;line-height:1.5}.filepick{display:block;border:1px dashed #cdd8cd;border-radius:13px;padding:12px;text-align:center;color:#7d9481;font-size:12px;cursor:pointer}.filepick input{display:none}.preview{max-width:100%;max-height:160px;display:block;margin:10px auto;border-radius:12px}.no-items{padding:28px 0}
@media(max-width:760px){.shell{padding:18px 16px 35px}.top{margin-bottom:18px}.date-label{display:none}.welcome h2{font-size:22px}.grid{grid-template-columns:1fr;gap:14px}.card{padding:18px;border-radius:21px}.list-card{grid-row:auto;grid-row:1}.day{height:39px}.month-card{grid-row:2}.bottom{margin-top:14px}.modal-bg{padding:12px}.month-foot{margin-top:8px}}
</style></head><body>
<main class="shell"><header class="top"><div class="brand"><div class="logo">🌱</div><div><h1>慢慢日常</h1><small>把每一天，過成喜歡的樣子</small></div></div><div class="date-label" id="todayLong"></div></header>
<section class="welcome"><h2 id="greeting">今天也為自己留一點時間 ☀️</h2><p id="welcomeDate"></p></section>
<div class="grid"><section class="card list-card"><div class="list-top"><div><h3 id="selectedTitle">今天的打卡</h3><div class="count" id="countLabel">慢慢來，一件一件完成</div></div><button class="add-btn" id="addBtn">＋ 新增事項</button></div><div class="items" id="items"></div><div class="bottom"><b>🍃</b><span>不必每天都滿分，願意開始就已經很棒了。</span></div></section>
<section class="card month-card"><div class="card-head"><h3>月曆回顧</h3><div class="month-nav"><button class="icon-btn" id="prev">‹</button><strong id="monthLabel"></strong><button class="icon-btn" id="next">›</button></div></div><div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class="calendar" id="calendar"></div><div class="month-foot"><span id="monthStats">本月完成 0 次</span><div class="progress"><i id="monthProgress" style="width:0%"></i></div></div></section></div>
</main><div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><section class="modal"><div class="modal-title"><h3 id="modalTitle">新增打卡事項</h3><button class="close" id="closeModal">×</button></div><div class="field"><label>事項名稱</label><input id="nameInput" maxlength="70" placeholder="例如：喝一杯水、散步 20 分鐘"></div><div class="field"><label>安排方式</label><div class="types"><button class="type-option active" data-type="daily">🔁 每天重複</button><button class="type-option" data-type="once">📌 只在這一天</button></div></div><div class="field"><label>日期</label><div class="voice-row"><input type="date" id="dateInput"><button class="voice" id="voiceBtn">🎙 語音安排</button></div><div class="rec-note" style="margin-top:6px">可以說「明天」、「十月二十五日」或「2026年10月25日」。若裝置支援語音辨識，說完會自動填入日期。</div></div><button class="save" id="saveBtn">新增到打卡清單</button></section></div>
<div class="modal-bg" id="recordBg"><section class="modal"><div class="modal-title"><h3 id="recordTitle">今日小記</h3><button class="close" id="closeRecord">×</button></div><div class="field"><label>寫下這一刻</label><textarea id="noteInput" maxlength="1500" placeholder="今天的心情、做完後的感受……"></textarea></div><div class="field"><label>也可以留一張照片</label><label class="filepick">＋ 選擇照片<input type="file" id="imageInput" accept="image/*"></label><img class="preview" id="imagePreview" style="display:none"></div><button class="save" id="saveRecord">儲存紀錄</button></section></div>
<script>
(()=>{const $=s=>document.querySelector(s), today=new Date(), key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, todayKey=key(today);let selected=todayKey, shown=new Date(today.getFullYear(),today.getMonth(),1), type='daily',activeItem=null,imageData=null;const load=()=>{try{return JSON.parse(localStorage.getItem('slowdays.v1')||'{"items":[]}')}catch{return{items:[]}}};let db=load();if(!Array.isArray(db.items))db.items=[];const save=()=>localStorage.setItem('slowdays.v1',JSON.stringify(db));const zhdate=d=>new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(d);$('#todayLong').textContent=zhdate(today);$('#welcomeDate').textContent=zhdate(today);const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function applies(it,date){return it.type==='daily'?date>=it.created:it.date===date}function list(){const d=new Date(selected+'T12:00:00');$('#selectedTitle').textContent=selected===todayKey?'今天的打卡':`${d.getMonth()+1}月${d.getDate()}日的打卡`;const its=db.items.filter(i=>applies(i,selected));const done=its.filter(i=>i.doneDates?.includes(selected)).length;$('#countLabel').textContent=its.length?`${done} / ${its.length} 件完成，照自己的步調就好`:'這一天還沒有安排事項';const box=$('#items');if(!its.length){box.innerHTML='<div class="empty"><span>☁️</span>留一點空白，也很好。<br>按「新增事項」開始安排吧</div>';return}box.innerHTML=its.map(i=>{let isDone=i.doneDates?.includes(selected),note=i.notes?.[selected];return `<div><div class="item ${isDone?'done':''}" data-id="${i.id}"><button class="check" aria-label="完成">${isDone?'✓':''}</button><div class="item-main"><div class="item-name">${safe(i.name)}</div><div class="item-meta">${i.type==='daily'?'每天重複':'單日事項'}${note?' · 有小記':''}</div></div><button class="record-btn" title="寫紀錄">✎ 小記</button><button class="delete-btn" title="刪除事項">×</button></div>${note?`<div class="note-preview">${safe(note.text||'')}${note.image?'　📷':''}</div>`:''}</div>`}).join('');box.querySelectorAll('.item').forEach(el=>{let id=el.dataset.id,it=db.items.find(x=>x.id===id);el.querySelector('.check').onclick=()=>toggle(it);el.querySelector('.record-btn').onclick=()=>openRecord(it);el.querySelector('.delete-btn').onclick=()=>{if(confirm(`刪除「${it.name}」？`)){db.items=db.items.filter(x=>x.id!==id);save();render()}}})}
function toggle(it){it.doneDates=it.doneDates||[];let n=it.doneDates.indexOf(selected);if(n>=0)it.doneDates.splice(n,1);else{it.doneDates.push(selected);burst()}save();render();if(n<0)toast('完成一件小事，真好 ✨')}function burst(){const rect=document.querySelector('.check')?.getBoundingClientRect();if(!rect)return;['✨','🌿','✦','🌼','♡'].forEach((c,n)=>{let e=document.createElement('span');e.className='confetti';e.textContent=c;e.style.left=(rect.left+8)+'px';e.style.top=(rect.top+5)+'px';e.style.setProperty('--x',`${(n-2)*27}px`);document.body.append(e);setTimeout(()=>e.remove(),900)})}
function calendar(){const y=shown.getFullYear(),m=shown.getMonth();$('#monthLabel').textContent=`${y}年 ${m+1}月`;let first=new Date(y,m,1),start=first.getDay(),days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate(),html='';for(let n=0;n<42;n++){let num,dt,dim=false;if(n<start){num=prevDays-start+n+1;dt=new Date(y,m-1,num);dim=true}else if(n>=start+days){num=n-start-days+1;dt=new Date(y,m+1,num);dim=true}else{num=n-start+1;dt=new Date(y,m,num)}let k=key(dt),has=db.items.some(i=>applies(i,k)),isToday=k===todayKey;html+=`<button class="day ${dim?'dim':''} ${k===selected?'selected':''} ${isToday?'today':''}" data-date="${k}">${num}${has?'<i class="dot"></i>':''}</button>`}$('#calendar').innerHTML=html;$('#calendar').querySelectorAll('.day').forEach(b=>b.onclick=()=>{selected=b.dataset.date;shown=new Date(selected+'T12:00:00');shown.setDate(1);render()});let total=0,completed=0;db.items.forEach(i=>{if(applies(i,todayKey)){total++;if(i.doneDates?.includes(todayKey))completed++}});$('#monthStats').textContent=`本月完成 ${db.items.reduce((a,i)=>a+(i.doneDates||[]).filter(k=>k.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)).length,0)} 次`;$('#monthProgress').style.width=total?`${Math.round(completed/total*100)}%`:'0%'}function render(){calendar();list()}$('#prev').onclick=()=>{shown.setMonth(shown.getMonth()-1);render()};$('#next').onclick=()=>{shown.setMonth(shown.getMonth()+1);render()};
function openAdd(){type='daily';document.querySelectorAll('.type-option').forEach(b=>b.classList.toggle('active',b.dataset.type===type));$('#nameInput').value='';$('#dateInput').value=selected;$('#modalBg').classList.add('open');setTimeout(()=>$('#nameInput').focus(),100)}$('#addBtn').onclick=openAdd;$('#closeModal').onclick=()=>$('#modalBg').classList.remove('open');$('#modalBg').onclick=e=>{if(e.target===$('#modalBg'))$('#modalBg').classList.remove('open')};document.querySelectorAll('.type-option').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('.type-option').forEach(x=>x.classList.toggle('active',x===b))});$('#saveBtn').onclick=()=>{let name=$('#nameInput').value.trim(),date=$('#dateInput').value||selected;if(!name){$('#nameInput').focus();toast('先為這件事取個名字吧');return}db.items.push({id:crypto.randomUUID?.()||String(Date.now()),name,type,date,created:todayKey,doneDates:[],notes:{}});save();selected=date;shown=new Date(date+'T12:00:00');shown.setDate(1);$('#modalBg').classList.remove('open');render();toast('已加入你的打卡清單 🌱')};
function parseDate(t){let d=new Date();let s=t.replace(/\s/g,'');if(s.includes('後天'))d.setDate(d.getDate()+2);else if(s.includes('明天'))d.setDate(d.getDate()+1);else if(s.includes('今天')||s.includes('今日')){}else{let m=s.match(/(20\d{2})年?(\d{1,2})月(\d{1,2})日?/);if(m)d=new Date(+m[1],+m[2]-1,+m[3]);else{let q=s.match(/(\d{1,2})月(\d{1,2})日?/);if(q){d=new Date(d.getFullYear(),+q[1]-1,+q[2]);if(d<new Date(todayKey+'T00:00:00'))d.setFullYear(d.getFullYear()+1)}else{let r=s.match(/(\d{1,2})[\/.-](\d{1,2})/);if(r){d=new Date(d.getFullYear(),+r[1]-1,+r[2]);if(d<today)d.setFullYear(d.getFullYear()+1)}else return null}}}return key(d)}$('#voiceBtn').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('目前瀏覽器不支援語音辨識，請直接選擇日期');return}let rec=new SR();rec.lang='zh-TW';rec.interimResults=false;rec.onstart=()=>$('#voiceBtn').classList.add('listening');rec.onend=()=>$('#voiceBtn').classList.remove('listening');rec.onerror=()=>toast('沒有聽清楚，請再試一次');rec.onresult=e=>{let spoken=e.results[0][0].transcript,date=parseDate(spoken);if(date){$('#dateInput').value=date;toast(`已安排在 ${date}`)}else toast(`聽到「${spoken}」，請再選擇日期`)};rec.start()};
function openRecord(it){activeItem=it;imageData=it.notes?.[selected]?.image||null;$('#recordTitle').textContent=`${it.name}｜今日小記`;$('#noteInput').value=it.notes?.[selected]?.text||'';$('#imagePreview').style.display=imageData?'block':'none';$('#imagePreview').src=imageData||'';$('#recordBg').classList.add('open')}$('#closeRecord').onclick=()=>$('#recordBg').classList.remove('open');$('#recordBg').onclick=e=>{if(e.target===$('#recordBg'))$('#recordBg').classList.remove('open')};$('#imageInput').onchange=e=>{let f=e.target.files?.[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{imageData=reader.result;$('#imagePreview').src=imageData;$('#imagePreview').style.display='block'};reader.readAsDataURL(f)};$('#saveRecord').onclick=()=>{activeItem.notes=activeItem.notes||{};let text=$('#noteInput').value.trim();if(text||imageData)activeItem.notes[selected]={text,image:imageData};else delete activeItem.notes[selected];save();$('#recordBg').classList.remove('open');render();toast('小記已收好 💛')};let toastTimer;function toast(s){let el=$('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}render()})();
</script><script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
